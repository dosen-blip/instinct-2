# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install image tooling
        run: sudo apt-get update && sudo apt-get install --yes webp
      - name: Audit responsive images
        run: node scripts/audit-images.mjs
      - name: Audit event and artist archive
        run: node scripts/audit-archive.mjs
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Wait for deployment artifact to become visible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 18); do
            count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
              --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length') || count=0
            if [ "$count" = "1" ]; then
              echo "The deployment artifact is available."
              sleep 10
              exit 0
            fi
            echo "Waiting for GitHub to expose the deployment artifact (attempt ${attempt}/18)."
            sleep 5
          done
          echo "::error::The deployment artifact did not become available in time."
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
