    <script>
      // the lit-sign intro: desktop (the WebGL hero) or phone (the baked plates), never with reduced motion; it
      // always opens at the top (a restored scroll position would count as a skip)
      if (matchMedia('(min-width: 721px)').matches && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.documentElement.classList.add('intro', 'intro-pending');
        history.scrollRestoration = 'manual';
      }
      if (matchMedia('(max-width: 720px)').matches && !matchMedia('(prefers-reduced-motion: reduce)').matches && !/[?&](nohero|still)/.test(location.search)) {
        document.documentElement.classList.add('intro', 'intro-pending');
        history.scrollRestoration = 'manual';
      }
    </script>
